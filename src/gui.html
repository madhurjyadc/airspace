<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airspace</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1b1f27;
    --muted: #5d6676;
    --border: #dde1e8;
    --accent: #2f6fed;
    --ok: #1f8a4c;
    --conflict: #c62828;
    --conflict-bg: #fdecec;
    --overlap: #a66300;
    --overlap-bg: #fff4de;
    --chip: #eef0f4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1a1e26;
      --text: #e6e9ef;
      --muted: #98a1b2;
      --border: #2b313c;
      --accent: #7aa2ff;
      --ok: #4cc27f;
      --conflict: #ff6b6b;
      --conflict-bg: #3a1c1f;
      --overlap: #f0b24d;
      --overlap-bg: #33280f;
      --chip: #262c37;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.01em; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .dot.off { background: var(--conflict); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .count { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .count b { color: var(--text); font-size: 16px; margin-right: 4px; }
  .count.bad { border-color: var(--conflict); background: var(--conflict-bg); color: var(--conflict); }
  .count.bad b { color: var(--conflict); }
  .count.warn { border-color: var(--overlap); background: var(--overlap-bg); color: var(--overlap); }
  .count.warn b { color: var(--overlap); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .card.conflict { border-left: 6px solid var(--conflict); background: var(--conflict-bg); }
  .card.overlap { border-left: 3px solid var(--overlap); }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .name { font-weight: 600; font-size: 16px; }
  .badge { font-size: 11px; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 0 8px; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; border-radius: 4px; padding: 1px 6px; }
  .tag.conflict { background: var(--conflict); color: #fff; }
  .tag.overlap { background: var(--overlap-bg); color: var(--overlap); border: 1px solid var(--overlap); }
  .sub { color: var(--muted); font-size: 13px; }
  .task { margin: 4px 0 0; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 0; list-style: none; }
  .file { font: 12px var(--mono); background: var(--chip); border-radius: 4px; padding: 2px 6px; overflow-wrap: anywhere; }
  .file.conflict { background: var(--conflict); color: #fff; font-weight: 700; }
  .file.overlap { outline: 1.5px solid var(--overlap); color: var(--overlap); }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 0; }
  .notshared { list-style: none; padding: 0; margin: 0; }
  .notshared li { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .notshared li:last-child { border-bottom: 0; }
  .notshared .file { background: none; padding: 0; }
  .problem { margin-top: 24px; color: var(--conflict); font-size: 13px; }
  .offline { background: var(--conflict-bg); color: var(--conflict); border: 1px solid var(--conflict); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Airspace</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="app"><div class="empty">Loading...</div></div>
</main>
<script>
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return el;
}

function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function agoEl(prefix, iso) {
  return h('span', { 'data-ts': iso, 'data-prefix': prefix }, prefix + ago(iso));
}

function fileList(files, clash) {
  if (!files.length) return h('div', { class: 'empty' }, 'No changes yet');
  const conflicts = new Set(clash ? clash.conflicts : []);
  const shared = new Set(clash ? clash.files : []);
  return h('ul', { class: 'files' }, files.map((f) => {
    const kind = conflicts.has(f) ? ' conflict' : shared.has(f) ? ' overlap' : '';
    return h('li', { class: 'file' + kind }, f);
  }));
}

function person(w, clash) {
  const kind = clash && clash.conflicts.length ? ' conflict' : clash ? ' overlap' : '';
  return h('div', { class: 'card' + kind },
    h('div', { class: 'row' },
      h('span', { class: 'name' }, w.name),
      h('span', { class: 'badge' }, w.agent ? 'agent' : 'person'),
      h('span', { class: 'sub' }, 'on ' + (w.branch || 'no branch')),
      h('span', { class: 'sub' }, agoEl('updated ', w.updatedAt))),
    w.task ? h('p', { class: 'task' }, w.task) : h('p', { class: 'task sub' }, 'No task set'),
    fileList(w.files, clash));
}

function clashCard(state, c) {
  const other = state.others.find((o) => o.id === c.with);
  const who = other ? other.name : c.with;
  const overlap = c.files.filter((f) => !c.conflicts.includes(f));
  const strong = c.conflicts.length > 0;
  return h('div', { class: 'card ' + (strong ? 'conflict' : 'overlap') },
    h('div', { class: 'row' },
      h('span', { class: 'tag ' + (strong ? 'conflict' : 'overlap') }, strong ? 'CONFLICT' : 'OVERLAP'),
      h('span', { class: 'name' }, 'You and ' + who)),
    strong ? h('p', { class: 'task' }, 'You both changed the same lines. Sort this out before merging.') : null,
    overlap.length ? h('p', { class: strong ? 'sub' : 'task' }, 'Same file, different lines (merges cleanly so far):') : null,
    overlap.length ? fileList(overlap, { conflicts: [], files: overlap }) : null,
    strong ? h('p', { class: 'sub' }, 'Same lines:') : null,
    strong ? fileList(c.conflicts, { conflicts: c.conflicts, files: c.files }) : null);
}

function render(state) {
  const app = document.getElementById('app');
  const meta = document.getElementById('meta');
  const conflicts = state.clashes.filter((c) => c.conflicts.length).length;
  const overlaps = state.clashes.length - conflicts;
  const nodes = [];

  nodes.push(h('div', { class: 'counts' },
    h('div', { class: 'count' }, h('b', {}, String(state.others.length)), 'working now'),
    h('div', { class: 'count' + (conflicts ? ' bad' : '') }, h('b', {}, String(conflicts)), conflicts === 1 ? 'conflict' : 'conflicts'),
    h('div', { class: 'count' + (overlaps ? ' warn' : '') }, h('b', {}, String(overlaps)), overlaps === 1 ? 'overlap' : 'overlaps')));

  nodes.push(h('h2', {}, 'Clashes with your work'));
  nodes.push(state.clashes.length
    ? state.clashes.slice().sort((a, b) => b.conflicts.length - a.conflicts.length).map((c) => clashCard(state, c))
    : h('div', { class: 'empty' }, 'None. Nobody is changing the same files as you.'));

  nodes.push(h('h2', {}, 'Others'));
  nodes.push(state.others.length
    ? state.others.map((o) => person(o, state.clashes.find((c) => c.with === o.id)))
    : h('div', { class: 'empty' }, 'Nobody else is changing this repo right now.'));

  nodes.push(h('h2', {}, 'You'));
  nodes.push(person(state.me, null));

  nodes.push(h('h2', {}, 'Not shared (kept on this machine)'));
  nodes.push(state.notShared.length
    ? h('ul', { class: 'notshared' }, state.notShared.map((n) => h('li', {}, h('span', { class: 'file' }, n.path), h('span', { class: 'sub' }, n.reason))))
    : h('div', { class: 'empty' }, 'Nothing was held back.'));

  if (state.daemon && state.daemon.lastError) nodes.push(h('div', { class: 'problem' }, 'Last sync problem: ' + state.daemon.lastError));

  app.replaceChildren(...nodes.flat());
  meta.replaceChildren(
    h('span', {}, h('span', { class: 'dot' }), 'connected'),
    h('span', {}, state.me.name + ' on ' + (state.me.branch || 'no branch')),
    agoEl('updated ', state.generatedAt));
}

function showOffline(message) {
  const app = document.getElementById('app');
  const meta = document.getElementById('meta');
  app.replaceChildren(h('div', { class: 'offline' }, message));
  meta.replaceChildren(h('span', {}, h('span', { class: 'dot off' }), 'not connected'));
}

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const body = await res.json();
    if (!res.ok) showOffline('Airspace is starting up. This page refreshes by itself.');
    else render(body);
  } catch (e) {
    showOffline('Cannot reach the Airspace process. Is it running? Try: airspace start');
  }
}

function tickAgo() {
  for (const el of document.querySelectorAll('[data-ts]')) {
    el.textContent = el.getAttribute('data-prefix') + ago(el.getAttribute('data-ts'));
  }
}

poll();
setInterval(poll, 2000);
setInterval(tickAgo, 1000);
</script>
</body>
</html>
